apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: route
  namespace: project
spec:
  parentRefs:
  - name: gw
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: web-a-svc
      port: 80
  - matches:
    - path:
        type: PathPrefix
        value: /api/notices
    backendRefs:
    - name: web-b-svc
      port: 80