    INSERT INTO notices (category, title, content, pinned, created_at) VALUES
    ('NOTICE', '온라인 진료 예약 서비스를 시작합니다', '이제 전화하지 않아도 진료 예약을 할 수 있습니다.
    
    · 예약 가능 기간: 오늘부터 14일
    · 진료 항목: 일반 진료, 예방접종, 건강검진 (각 30분)
    · 신청한 시간은 바로 잡히며, 병원에서 확인한 뒤 ‘예약 확정’으로 바뀝니다.
    · 변경·취소는 ‘내 예약’에서 직접 할 수 있습니다.
    
    계정이 없으신 보호자님은 방문 시 접수처에 말씀해 주세요.', 0, '2026-09-28 10:00:00'),
    ('NOTICE', '고양이 전용 대기 공간 안내', '고양이 보호자님은 접수 후 오른쪽 ‘고양이 대기 공간’에서 기다려 주세요.
    강아지와 동선을 분리해 아이들이 덜 긴장하도록 준비했습니다.', 0, '2026-10-05 10:00:00'),
    ('CLOSED', '공휴일 휴진 안내', '공휴일에는 휴진합니다. 온라인 예약은 공휴일에도 신청할 수 있으며, 다음 진료일에 순서대로 확인해 드립니다.
    응급 상황에는 가까운 24시 응급 동물병원을 이용해 주세요.', 0, '2026-10-10 10:00:00'),
    ('NOTICE', '주차 안내 (건물 뒤편 전용 주차장)', '건물 뒤편 전용 주차 6대 · 진료 시 1시간 무료
    주차 공간이 부족할 때는 인근 공영주차장을 이용해 주세요.', 0, '2026-10-14 10:00:00'),
    ('EVENT', '예방접종 할인 예약 오픈 — 10월 26일(월) 09:00', '10월 26일(월)부터 10월 28일(수)까지 3일간 예방접종을 할인된 가격으로 진행합니다.
    
    · 대상: 강아지·고양이 종합백신, 광견병, 심장사상충 예방
    · 예약: 온라인 예약 → 진료 항목 ‘예방접종’ → 할인 기간 날짜 선택
    · 할인 기간에는 수의사 3명 모두 예방접종만 진료합니다.
    
    예약이 몰리면 같은 시간을 여러 보호자님이 동시에 신청할 수 있습니다. 먼저 처리된 한 건만 예약되며, ‘이미 예약된 시간’ 안내를 받으시면 다른 시간을 선택해 주세요.', 1, '2026-10-18 10:00:00');
